name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache-bust static assets
        # Stamps every "?v=__CACHE_BUST__" reference (the entry script/
        # stylesheet in index.html, and every internal ES module import)
        # with this commit's SHA, so browsers/CDN always fetch fresh
        # files after a deploy instead of serving a stale cached copy.
        run: |
          grep -rl '__CACHE_BUST__' --include='*.html' --include='*.js' . \
            | xargs sed -i "s/__CACHE_BUST__/${GITHUB_SHA}/g"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
